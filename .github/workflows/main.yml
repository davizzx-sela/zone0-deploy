name: Deploy Zona Zero

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório privado
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.ZONE0_REPO }}
          token: ${{ secrets.ZONE0_GITHUB_TOKEN }}

      - name: Instalar Supabase CLI
        run: npm install -g supabase

      - name: Deploy Supabase Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase init --force
          supabase link --project-ref lasiedmfllanxoadsrys
          supabase db push --remote --include-all --yes
          
